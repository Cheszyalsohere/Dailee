<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="2100" viewBox="0 0 2600 2100" role="img" aria-labelledby="title desc"><title id="title">Dailee — Alur Fitur</title><desc id="desc">Alur data utama dari pendaftaran sampai home feed, unggahan momen, interaksi, hubungan sosial, pesan langsung, kalender, arsip, profil, dan rekap bulanan.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FBFAFF"/><stop offset="1" stop-color="#F1ECFF"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#4B3477" flood-opacity=".12"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8B7BB2"/></marker><marker id="arrowDashed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#F29A38"/></marker></defs><rect width="100%" height="100%" fill="url(#bg)"/>
<text x="80" y="75" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="46" font-weight="750" fill="#7558D1" text-anchor="start">DAILEE · ALUR DATA FITUR</text>
<text x="82" y="117" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="450" fill="#746B83" text-anchor="start">Dari aktivitas pengguna ke tabel yang menyimpan data • fitur turunan ditandai sebagai hasil query, bukan tabel</text>
<g filter="url(#shadow)"><rect x="90" y="170" width="480" height="170" rx="20" fill="#FFFFFF" stroke="#7558D1" stroke-width="3"/></g><text x="112" y="208" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="750" fill="#7558D1" text-anchor="start">1 · AKUN &amp; AUTENTIKASI</text>
<text x="112" y="246" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">Daftar / login → users</text>
<text x="112" y="274" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">Profil, avatar, bio, lokasi, pendidikan</text>
<g filter="url(#shadow)"><rect x="760" y="170" width="480" height="170" rx="20" fill="#FFFFFF" stroke="#7558D1" stroke-width="3"/></g><text x="782" y="208" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="750" fill="#7558D1" text-anchor="start">2 · HOME FEED</text>
<text x="782" y="246" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">Momen sendiri + teman</text>
<text x="782" y="274" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">Friends of Friends melalui relasi accepted</text>
<g filter="url(#shadow)"><rect x="1430" y="170" width="480" height="170" rx="20" fill="#FFFFFF" stroke="#7558D1" stroke-width="3"/></g><text x="1452" y="208" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="750" fill="#7558D1" text-anchor="start">3 · TANGKAP MOMEN</text>
<text x="1452" y="246" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">Ambil selfie + foto utama</text>
<text x="1452" y="274" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">Caption, mood, privasi, waktu</text>
<g filter="url(#shadow)"><rect x="2090" y="170" width="420" height="170" rx="20" fill="#FFFFFF" stroke="#7558D1" stroke-width="3"/></g><text x="2112" y="208" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="750" fill="#7558D1" text-anchor="start">SIMPAN</text>
<text x="2112" y="246" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">users.id → moments.user_id</text>
<text x="2112" y="274" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">opsional moments.schedule_id</text>
<path d="M570 255 L760 255" fill="none" stroke="#8B7BB2" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1240 255 L1430 255" fill="none" stroke="#8B7BB2" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1910 255 L2090 255" fill="none" stroke="#8B7BB2" stroke-width="3" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="90" y="570" width="480" height="210" rx="20" fill="#FFFFFF" stroke="#7558D1" stroke-width="3"/></g><text x="112" y="608" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="750" fill="#7558D1" text-anchor="start">4 · HUBUNGAN SOSIAL</text>
<text x="112" y="646" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">Permintaan → friendships.pending</text>
<text x="112" y="674" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">Terima → accepted (mutual dua arah)</text>
<text x="112" y="702" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">Follow/unfollow → follows independen</text>
<g filter="url(#shadow)"><rect x="760" y="570" width="480" height="210" rx="20" fill="#FFFFFF" stroke="#7558D1" stroke-width="3"/></g><text x="782" y="608" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="750" fill="#7558D1" text-anchor="start">5 · AKSI PADA MOMEN</text>
<text x="782" y="646" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">Like / emoji → post_reactions</text>
<text x="782" y="674" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">Komentar → post_comments</text>
<text x="782" y="702" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">Share → post_shares</text>
<g filter="url(#shadow)"><rect x="1430" y="570" width="480" height="210" rx="20" fill="#FFFFFF" stroke="#7558D1" stroke-width="3"/></g><text x="1452" y="608" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="750" fill="#7558D1" text-anchor="start">6 · INBOX / DM</text>
<text x="1452" y="646" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">Pilih teman mutual</text>
<text x="1452" y="674" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">Pesan masuk/keluar tersimpan di chats</text>
<text x="1452" y="702" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">sender_id dan receiver_id</text>
<g filter="url(#shadow)"><rect x="2090" y="570" width="420" height="210" rx="20" fill="#FFFFFF" stroke="#7558D1" stroke-width="3"/></g><text x="2112" y="608" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="750" fill="#7558D1" text-anchor="start">AKSES FEED</text>
<text x="2112" y="646" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">friendships.status = accepted</text>
<text x="2112" y="674" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">visibility menentukan audiens</text>
<text x="2112" y="702" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">Follow tidak otomatis menjadi teman</text>
<path d="M570 675 L760 675" fill="none" stroke="#8B7BB2" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1240 675 L1430 675" fill="none" stroke="#8B7BB2" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1910 675 L2090 675" fill="none" stroke="#8B7BB2" stroke-width="3" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="90" y="1050" width="480" height="220" rx="20" fill="#FFFFFF" stroke="#7558D1" stroke-width="3"/></g><text x="112" y="1088" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="750" fill="#7558D1" text-anchor="start">7 · AGENDA &amp; TUGAS</text>
<text x="112" y="1126" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">Buat agenda / to-do → schedules</text>
<text x="112" y="1154" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">Tanggal, jam, status, lokasi</text>
<text x="112" y="1182" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">Pengingat &amp; sinkron kalender</text>
<g filter="url(#shadow)"><rect x="760" y="1050" width="480" height="220" rx="20" fill="#FFFFFF" stroke="#7558D1" stroke-width="3"/></g><text x="782" y="1088" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="750" fill="#7558D1" text-anchor="start">8 · MEMORIES / KALENDER</text>
<text x="782" y="1126" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">Arsip harian: moments.created_at</text>
<text x="782" y="1154" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">Agenda harian: schedules.start_time</text>
<text x="782" y="1182" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">Foto agenda dapat ditautkan ke momen</text>
<g filter="url(#shadow)"><rect x="1430" y="1050" width="480" height="220" rx="20" fill="#FFFFFF" stroke="#7558D1" stroke-width="3"/></g><text x="1452" y="1088" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="750" fill="#7558D1" text-anchor="start">9 · REKAP BULANAN</text>
<text x="1452" y="1126" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">Pilih bulan → kumpulkan data bulan itu</text>
<text x="1452" y="1154" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">Jumlah momen / hari aktif</text>
<text x="1452" y="1182" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">Agenda selesai &amp; total agenda</text>
<g filter="url(#shadow)"><rect x="2090" y="1050" width="420" height="220" rx="20" fill="#FFFFFF" stroke="#7558D1" stroke-width="3"/></g><text x="2112" y="1088" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="750" fill="#7558D1" text-anchor="start">10 · PROFIL</text>
<text x="2112" y="1126" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">users + statistik relasi</text>
<text x="2112" y="1154" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">Teman, followers, following</text>
<text x="2112" y="1182" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">Log milik akun</text>
<path d="M570 1160 L760 1160" fill="none" stroke="#8B7BB2" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1240 1160 L1430 1160" fill="none" stroke="#8B7BB2" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1910 1160 L2090 1160" fill="none" stroke="#8B7BB2" stroke-width="3" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="90" y="1530" width="480" height="230" rx="20" fill="#FFFFFF" stroke="#7558D1" stroke-width="3"/></g><text x="112" y="1568" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="750" fill="#7558D1" text-anchor="start">TABEL PENYIMPANAN</text>
<text x="112" y="1606" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">users · friendships · follows</text>
<text x="112" y="1634" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">moments · schedules · chats</text>
<text x="112" y="1662" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">post_comments / reactions / shares</text>
<text x="112" y="1690" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">moment_tags</text>
<g filter="url(#shadow)"><rect x="760" y="1530" width="480" height="230" rx="20" fill="#FFFFFF" stroke="#7558D1" stroke-width="3"/></g><text x="782" y="1568" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="750" fill="#7558D1" text-anchor="start">DATA TURUNAN</text>
<text x="782" y="1606" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">Feed = query + izin visibilitas</text>
<text x="782" y="1634" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">Notifikasi = jadwal terdekat</text>
<text x="782" y="1662" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">Rekap = agregasi per bulan</text>
<text x="782" y="1690" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">Bukan tabel terpisah</text>
<g filter="url(#shadow)"><rect x="1430" y="1530" width="480" height="230" rx="20" fill="#FFFFFF" stroke="#7558D1" stroke-width="3"/></g><text x="1452" y="1568" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="750" fill="#7558D1" text-anchor="start">ARSIP TERINTEGRASI</text>
<text x="1452" y="1606" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">Foto dan agenda ditampilkan per tanggal</text>
<text x="1452" y="1634" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">schedule_id menautkan agenda ke momen</text>
<text x="1452" y="1662" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">Momen tanpa agenda tetap dapat diarsipkan</text>
<g filter="url(#shadow)"><rect x="2090" y="1530" width="420" height="230" rx="20" fill="#FFFFFF" stroke="#7558D1" stroke-width="3"/></g><text x="2112" y="1568" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="750" fill="#7558D1" text-anchor="start">CATATAN SKEMA</text>
<text x="2112" y="1606" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">FK* di ERD = relasi aplikasi</text>
<text x="2112" y="1634" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">academic_schedule = tabel legacy</text>
<text x="2112" y="1662" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#241B35" text-anchor="start">Bahasa / tema UI bukan tabel database</text>
<path d="M330 1270 L330 1530" fill="none" stroke="#8B7BB2" stroke-width="3" marker-end="url(#arrow)"/><text x="330" y="1390" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#8B7BB2" text-anchor="middle">tulis / baca</text>
<path d="M1000 1270 L1000 1530" fill="none" stroke="#8B7BB2" stroke-width="3" marker-end="url(#arrow)"/><text x="1000" y="1390" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#8B7BB2" text-anchor="middle">query</text>
<path d="M1670 1270 L1670 1530" fill="none" stroke="#8B7BB2" stroke-width="3" marker-end="url(#arrow)"/><text x="1670" y="1390" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#8B7BB2" text-anchor="middle">agregasi</text>
<path d="M2300 1270 L2300 1530" fill="none" stroke="#8B7BB2" stroke-width="3" marker-end="url(#arrow)"/><text x="2300" y="1390" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#8B7BB2" text-anchor="middle">ambil profil</text>
<text x="90" y="1890" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="750" fill="#7558D1" text-anchor="start">ALUR INTI</text>
<text x="90" y="1930" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#241B35" text-anchor="start">Akun → Feed → Momen → Interaksi sosial → Memories &amp; Kalender → Arsip harian → Rekap bulanan</text>
<text x="90" y="1980" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="450" fill="#746B83" text-anchor="start">Diagram mengikuti schema dan controller aplikasi saat ini; notifikasi, feed, dan rekap dibentuk dari query.</text>
</svg>